
name: Docker Learning - Day 2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Docker Version
        run: docker --version

      - name: Build Docker Image
        run: docker build -t php-crud-app:day2 .

      - name: List Docker Images
        run: docker images

      - name: Run Docker Container
        run: docker run php-crud-app:day2

      - name: Verify Container
        run: docker ps -a
