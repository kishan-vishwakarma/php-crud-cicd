name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. CI Step: GitHub Cloud Runner
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: crud_demo
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit Tests
        run: ./vendor/bin/phpunit tests/TaskTest.php
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: 1234
          DB_NAME: crud_demo

  # 2. CD Step: Local Runner
  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Deploy Code to Live Folder
        run: |
          cd /var/www/html/php-crud-live
          git pull origin main